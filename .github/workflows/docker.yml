# Publishes the image to ghcr.io on every version tag (git tag v0.1.0 &&
# git push origin v0.1.0). The checks run first so a tag on a broken commit
# never becomes an image people pull.
name: Publish Docker image

on:
  push:
    tags: ['v*']

env:
  # Lowercase is mandatory for registry names, whatever the repository's case.
  IMAGE: ghcr.io/nhibel/flemarr

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # styled-system is generated and gitignored; web typecheck and tests need it.
      - run: pnpm --filter @flemarr/web exec panda codegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 is built under emulation: slower, but covers Raspberry Pi and ARM NAS.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.1.0 → tags 0.1.0, 0.1 and latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
