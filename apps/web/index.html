<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flemarr</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        // The second key is the pre-Flemarr name, read until migrateStorageKeys
        // (src/lib/migrate-storage-keys.ts) has moved it on first load.
        var t = localStorage.getItem('flemarr-theme') || localStorage.getItem('rom-curator-theme');
        var d = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (d === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
