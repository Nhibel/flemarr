services:
  rom-curator:
    build: .
    image: rom-curator:latest
    container_name: rom-curator
    restart: unless-stopped
    ports:
      # Loopback-only by default: the app has NO authentication (see
      # docs/security.md). Override BIND_ADDR (e.g. 0.0.0.0) only on a trusted
      # LAN, and never expose to the internet without an authenticated reverse
      # proxy or a VPN in front.
      - '${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:3000'
    environment:
      - PORT=3000
      - ROM_CURATOR_DATA_DIR=/data
      # The single library root. Browsing, scan and download are confined to
      # it; in the app you navigate inside it to pick (or create) subfolders.
      - ROMS_ROOT=/roms
    volumes:
      # SQLite DB + DAT cache — survives container recreation.
      - rom-curator-data:/data
      # Your ROM library, mounted at /roms. Set ROMS_HOST_DIR in .env to your
      # library path; defaults to ./roms next to this file (created empty if
      # absent, so the stack always comes up).
      - ${ROMS_HOST_DIR:-./roms}:/roms

volumes:
  rom-curator-data:
