services:
  flemarr:
    # Published by .github/workflows/docker.yml on every version tag. To build
    # from source instead, add docker-compose.build.yml (see the README).
    image: ghcr.io/nhibel/flemarr:latest
    container_name: flemarr
    restart: unless-stopped
    ports:
      # Loopback-only by default: the app has NO authentication (see
      # docs/security.md). Override BIND_ADDR (e.g. 0.0.0.0) only on a trusted
      # LAN, and never expose to the internet without an authenticated reverse
      # proxy or a VPN in front.
      - '${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:3000'
    environment:
      - PORT=3000
      - FLEMARR_DATA_DIR=/data
      # The single library root. Browsing, scan and download are confined to
      # it; in the app you navigate inside it to pick (or create) subfolders.
      - ROMS_ROOT=/roms
      # debug traces every external request and cache lookup.
      - LOG_LEVEL=${LOG_LEVEL:-info}
    # Keeps the logs from growing without bound.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      # SQLite DB + DAT cache — survives container recreation.
      - flemarr-data:/data
      # Your ROM library, mounted at /roms. Set ROMS_HOST_DIR in .env to your
      # library path; defaults to ./roms next to this file (created empty if
      # absent, so the stack always comes up).
      - ${ROMS_HOST_DIR:-./roms}:/roms

volumes:
  flemarr-data:
    # A fixed name, not prefixed with the stack name, so the migration steps
    # in the README can address it whatever the stack is called.
    name: flemarr-data
